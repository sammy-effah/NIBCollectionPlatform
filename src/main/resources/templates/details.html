	<script>
		getDonateDetailsList();

		function getDonateDetailsList() {

			// $("#loading").show();

			$
				.ajax({
					'url': "[[@{/nib/api/donation-details/all}]]",
					'method': "GET",

					'contentType': 'application/json'
				})
				.done(
					function (data) {

						$('#datatable')
							.dataTable(
								{
									// "scrollY": 500,
									"scrollX": true,
									"processing": true,

									"destroy": true,

									pageLength: 10,

									"aaData": data,

									"dom": 'lBfrtip',

									buttons: [
										'copy', 'csv', 'excelHtml5', 'pdfHtml5', 'print'
									],
									order: [0, "desc"],

									"columns": [

										{
											"data": "id"
										},

										{
											data: "date",
											render: function (data) {
												return formatDate(data);
											}
										},

										{
											"data": "name"
										},

										{
											"data": "picLocation"
										},

										{
											"data": "purpose"
										},


										{
											"data": "enabled"
										},

										{
											"data": null
										}

									],

									"columnDefs": [

										{
											"targets": -1,
											// "data": "enabled",
											"defaultContent": "",
											"render": function (data, type, row) {

												if (data.enabled === true) {
													return "<button class='btn btn-warning btn-sm warning' style='background-color:#ffA500' onclick='triggerDisableDialogue(this)'>" +
														"<span style='color:#ffffff'>Disable</span></button>" +
														"<button class='btn btn-default btn-sm save' style='background-color:#00008b' onclick='triggerEditModal(this)'>" +
														"<span style='color:#ffffff'>Edit</span></button>" +
														"<button class='btn btn-default btn-sm save' style='background-color:#f44336' onclick='triggerDeleteDialogue(this)'>" +
														"<span style='color:#ffffff'>Delete</span></button>";
												} else {
													return "<button class='btn btn-default btn-sm update' style='background-color:#5eba7d' onclick='triggerEnableDialogue(this)'>" +
														"<span style='color:#ffffff'>Enable</span></button>" +
														"<button class='btn btn-default btn-sm save' style='background-color:#00008b' onclick='triggerEditModal(this)'>" +
														"<span style='color:#ffffff'>Edit</span></button>" +
														"<button class='btn btn-default btn-sm save' style='background-color:#f44336' onclick='triggerDeleteDialogue(this)'>" +
														"<span style='color:#ffffff'>Delete</span></button>";
												}

											}
										},

									]

								});



					});

		}

		function formatDate(timestamp) {
			// Create a date object from the timestamp (assuming it's in milliseconds)
			var date = new Date(timestamp);

			// Extract date components
			var year = date.getFullYear();
			var month = String(date.getMonth() + 1).padStart(2, '0'); // Add leading zero
			var day = String(date.getDate()).padStart(2, '0'); // Add leading zero
			var hours = String(date.getHours()).padStart(2, '0'); // Add leading zero
			var minutes = String(date.getMinutes()).padStart(2, '0'); // Add leading zero
			var seconds = String(date.getSeconds()).padStart(2, '0'); // Add leading zero

			// Return formatted date string
			return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
		}
	</script>

	<script type="text/javascript">
		function addUser(e) {
			// e.preventDefault(); 
			$("#loading").show();

			var firstName = $("#firstName").val();
			var roleList = [$("#role").val()];
			var lastName = $("#lastName").val();
			var phoneNumber = $("#phoneNumber").val();
			var email = $("#email").val();
			var username = $("#username").val();

			if (email != "" && phoneNumber != "") {
				var UsersObj = {
					firstName: firstName,
					lastName: lastName,
					phoneNumber: phoneNumber,
					email: email,
					role: roleList[0],
					username: username
				};

				$.ajax({
					url: "[[@{/nib/api/add-user}]]",
					method: "POST",
					data: JSON.stringify(UsersObj),
					contentType: 'application/json'
				}).done(function (data) {

					$("#loading").hide();
					if (data.status == "00") {
						swal({
							title: "Success!",
							text: "User data added successfully!",
							icon: "success",
							button: "Ok"
						});
					} else {
						swal({
							title: "Error!",
							text: "There was an error adding data.",
							icon: "error",
							button: "Ok"
						});
					}
					$('#add-user-modal').modal('hide');
					getDonateDetailsList();

				}).fail(function (jqXHR, textStatus, errorThrown) {
					console.error("Error occurred: " + textStatus, errorThrown);
					swal("An error occurred while fetching data", "Error");
				});

			}

		}

					$.ajax({

						'url': "[[@{/nib/api/add-donation-details}]]",
						'method': "POST",
						// 'X-CSRF-TOKEN': csrfToken,
						'data': formData,

						contentType: false, // Important for FormData
						processData: false,

						success: function (response) {
							$('#add-donation-form').modal('hide');
							if (response.status == "00") {
								swal("Image saved successfully for donation details of " + response.message, "success");
							} else if (response.status == "06") {
								swal("There was an error adding data", "Error");
							}
							else {
								swal("Image failed to save:" + " An error occurred!", "Error");
							}
						},

						error: function (jqXHR, textStatus, errorThrown) {
							$('#add-donation-form').modal('hide');
							// Handle errors during image saving (optional)
							swal("Error saving image:", textStatus, errorThrown, "Error");


						}

					})

				}

			});
		});
	</script>
