<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{fragments/header :: head (~{::title})}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A fully featured admin theme which can be used to build CRM, CMS, etc.">
    <meta name="author" content="Coderthemes">

    <link rel="shortcut icon" th:src="@{/images/favicon_1.ico}">

    <title>NIB Collection :: login</title>
    <!-- Custom Files -->
    <link th:href="@{/static/css/helper.css}" rel="stylesheet" type="text/css" />
    <link th:href="@{/static/css/style.css}" rel="stylesheet" type="text/css" />

</head>

<body style="position: relative; min-height: 100vh; background-color: #f8f9fa;">
<div style="
    position: absolute;
    top: 10%;
    left: 5%;
    z-index: 0;
    opacity: 0.57;
    font-size: 35vw;  /* Responsive size based on viewport width */
    color: #4169E1;
    pointer-events: none;
    line-height: 1;
">
    <i class='fas fa-solid fa-hand-holding-dollar'></i>
</div>
    <div class="container" style="padding-top: 5%;">

        <div class="row">
            <div class="col-md-4 mx-auto">
             <div class="panel panel-default" style="max-width: 1100px; margin: 40px auto; padding: 30px; font-size: 1.2rem;">

    <div class="card" style="padding: 20px; box-shadow: 0 0 15px rgba(0,0,0,0.1); border-radius: 10px; width: 500px;" >

        <!-- Logo -->
        <div class="text-center mb-3">
            <img width="120" height="100" th:src="@{https://iili.io/dk9VxEl.jpg}" />
        </div>

        <!-- Title -->
        <h2 class="card-title text-center text-white mb-4"
            style="height: 60px; line-height: 60px; background-color: #4169E1; border-radius: 8px;">
            NIB Offsite Cash Collection Portal 
        </h2>

        <!-- Form -->
        <div class="card-body">
            <form th:object="${credentials}" th:action="@{login}" method="post">

                <!-- Username Field -->
                <div class="mb-4">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control form-control-lg" id="username" name="username"
                        th:field="*{username}" placeholder="Enter your username" required />
                </div>

                <!-- Password Field -->
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <input type="password" id="password" name="password" class="form-control form-control-lg"
                            th:field="*{password}" placeholder="Enter your password" required />
                        <button type="button" id="togglePassword" class="btn btn-secondary btn-lg">
                           <i id="eyeIcon" class="fas fa-eye"></i>
                        </button>

                    </div>
                </div>

                <!-- Login Button -->
                <div class="mb-4">
                    <button class="btn btn-primary btn-lg w-100" name="Submit" value="Login" type="submit" style="background-color: #4169E1 !important;">
                        Log In
                    </button>
                </div>

                <!-- Error messages -->
                <div style="color:red" th:if="${param.error}">Validation error</div>
                <div th:if="${param.logout}">You have been logged out.</div>
                <div class="error" th:if="${param.sessionExpired == true}">
                    Session Expired! Please login again.
                </div>

            </form>
        </div>
    </div>
</div>
            </div>
        </div>
    </div>
  <!-- Include jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
   <!-- Include jQuery Cookie Plugin -->
   <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>

    <script>
        var resizefunc = [];

        document.addEventListener('DOMContentLoaded', function() {
  const passwordInput = document.getElementById('password');
  const togglePasswordButton = document.getElementById('togglePassword');

  togglePasswordButton.addEventListener('click', function() {
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      togglePasswordButton.textContent = 'Hide';
    } else {
      passwordInput.type = 'password';
      togglePasswordButton.textContent = 'Show';
    }
  });
});
    </script>
