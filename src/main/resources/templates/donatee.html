			<!-- Start content -->

				<div class="container">
					<input type="hidden" id="loggedInUser" th:value="${username}">
					<!-- Page-Title -->

						<!-- <div class="col-md-3"></div> -->

						<!-- Modal -->

					<!-- /.modal -->

					<div style="display: none" id="loading"></div>

				</div>
			</div>


		</div>

		<div class="row">
			<div class="col-md-12">

				<div class="card card-default">
					<div class="card-header">
						<h3 class="card-title">Select Donation or Collection Details</h3>
					</div>
					<div class="card-body">

						<div class="row">
							<div class="col-md-12">

								<form id="add-collection-form" method="" action="#" novalidate>

									<div class="row">

										<div class="col-md-6">
											<div class="mb-3">
												<label for="donation-details" class="control-label">Select Donatee
												</label> <select class="form-select" id="donation-details"
													name="donation-details">
												</select>
											</div>
										</div>

									</div>
									<div class="row">

										<div class="col-md-6">

											<button id="btnDonateeIdAdd" type="submit"
												class="btn btn-primary ">Continue</button>
										</div>

									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>

		</div>
		<!-- End Row -->


	</div>

	<script>

		function storeDonateeId() {
			var selectedDonateeId = $('#donation-details').val();

			// Check for null, empty, or undefined
			if (!selectedDonateeId || selectedDonateeId.trim() === "") {
				return false;
			}

			localStorage.setItem('donationDetailsId', selectedDonateeId);
			return true;
		}

		$('#btnDonateeIdAdd').click(function (e) {
			e.preventDefault();

			if (storeDonateeId()) {
				window.location.href = '/collection';
			} else {
				alert("Please select a donation detail before proceeding.");
			}
		});


	</script>

	<script>

		$(document).ready(function () {
			$.ajax({
				// 'url': "[[@{/nib/api/get-donation-details-for-selection}]]",
				'url': "[[@{/nib/api/donation-details/by-enabled}]]",
				'method': "GET",

				'contentType': 'application/json',

			}).done(function (data) {

				if (data.status == "00") {

					populateSelect(data.message);

				} else {
					console.error("Error:", textStatus, errorThrown);
				}
			});
		});


		function populateSelect(data) {
			var donationSelect = $("#donation-details"); // Replace with your select element ID

			donationSelect.empty(); // Clear existing options

			const donationData = JSON.parse(data);

			$.each(donationData, function (index, donation) {
				const option = $('<option></option>')
					.val(donation.id) // Set option value as donation ID
					.text(donation.name + " at " + donation.location); // Set option text as donation name
				donationSelect.append(option);
			});
		}

	</script>
